services:
  enterprise:
    build: .
    image: auto-fnol-participant
    working_dir: /app
    command: ["python", "tools/runtime.py", "serve", "--host", "0.0.0.0", "--port", "8767"]
    ports:
      - "127.0.0.1:8767:8767"
  copilot:
    build: .
    image: auto-fnol-participant
    working_dir: /app
    environment:
      ENTERPRISE_URL: http://enterprise:8767
      HOST: 0.0.0.0
      PORT: "8080"
      HARBORLIGHT_RETRY_BASE_SECONDS: "0.05"
    command: ["python", "-m", "harborlight", "serve"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - enterprise
