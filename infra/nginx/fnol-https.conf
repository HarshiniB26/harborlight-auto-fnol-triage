# Install this file only after Certbot has written a certificate.
# Replace the name below, then remove infra/nginx/fnol.conf from sites-enabled
# so port 80 redirects instead of serving the application over HTTP.
#
#   sudo cp infra/nginx/fnol-https.conf /etc/nginx/conf.d/fnol.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS is not active until that certificate exists.

server {
    listen 80;
    server_name fnol.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fnol.example.com;
    ssl_certificate /etc/letsencrypt/live/fnol.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fnol.example.com/privkey.pem;
    root /opt/fnol/web;
    index index.html;
    client_max_body_size 1m;

    location /static/ {
        alias /opt/fnol/web/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /health { proxy_pass http://127.0.0.1:8080/health; }
    location = /ready { proxy_pass http://127.0.0.1:8080/ready; }
    location = /metrics { proxy_pass http://127.0.0.1:8080/metrics; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
