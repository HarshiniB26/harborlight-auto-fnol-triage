[project]
name = "fde-auto-fnol-training"
version = "1.0.0"
description = "Fictional Associate FDE capstone simulator and fixtures"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
]
[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "mypy>=2.4,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.17,<0.18",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/hardening_demo.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["workbench", "tools"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["workbench", "tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
