[project]
name = "fde-auto-fnol-training"
version = "1.0.0"
description = "Fictional Associate FDE capstone simulator and fixtures"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
]
[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.coverage.run]
branch = true
source = ["workbench", "tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
