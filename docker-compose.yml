# Local workspace. The repo is mounted at /app; uv sync rebuilds .venv there.
services:
  app:
    build: .
    image: auto-fnol-participant
    working_dir: /app
    volumes:
      - .:/app
    # Recreate the venv on the mounted tree so host files do not hide it.
    command: >
      sh -c "uv sync --locked && sleep infinity"

  runtime:
    build: .
    image: auto-fnol-participant
    command: >
      python tools/runtime.py serve
      --host 0.0.0.0
      --port 8767
      --state /var/lib/fnol/mock.sqlite
    volumes:
      - runtime-state:/var/lib/fnol
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8767/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  workbench:
    build: .
    image: auto-fnol-participant
    command: >
      python -m workbench.server
      --host 0.0.0.0
      --port 8080
      --api http://runtime:8767
      --state /var/lib/fnol/workbench.json
    volumes:
      - workbench-state:/var/lib/fnol
    depends_on:
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy-entrypoint.sh:/proxy-entrypoint.sh:ro
      - proxy-certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/proxy-entrypoint.sh"]
    depends_on:
      workbench:
        condition: service_healthy

volumes:
  runtime-state:
  workbench-state:
  proxy-certs:
