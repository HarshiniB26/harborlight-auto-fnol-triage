# Local workspace. The repo is mounted at /app; uv sync rebuilds .venv there.
services:
  app:
    build: .
    image: auto-fnol-participant
    working_dir: /app
    volumes:
      - .:/app
    # Recreate the venv on the mounted tree so host files do not hide it.
    command: >
      sh -c "uv sync --locked && sleep infinity"

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: fnol
      POSTGRES_PASSWORD: fnol_local_test
      POSTGRES_DB: fnol
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnol -d fnol"]
      interval: 5s
      timeout: 5s
      retries: 20

