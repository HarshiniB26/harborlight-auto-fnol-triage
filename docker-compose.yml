# Local development remains file-backed; AWS uses RDS and S3 adapters.
services:
  runtime:
    build: .
    image: auto-fnol-participant
    command: ["python", "tools/runtime.py", "serve", "--port", "8767"]
    volumes:
      - runtime-state:/app/.state
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8767/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  workbench:
    build: .
    image: auto-fnol-participant
    command:
      ["python", "-m", "workbench.server", "--host", "0.0.0.0", "--port", "8080", "--api", "http://runtime:8767"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - workbench-state:/app/.state
    depends_on:
      runtime:
        condition: service_healthy

volumes:
  runtime-state:
  workbench-state:
